name: StartOS Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startos-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      START_CLI_VERSION: v0.4.0-alpha.21
      START_CLI_SHA256: 0f77f0644f8e2f44bf82a11ae50d58f0d715a04d2a8c3de17eb1c3debb9ac1a6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install start-cli
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/Start9Labs/start-technologies/releases/download/${START_CLI_VERSION}/start-cli_x86_64-linux" \
            -o /tmp/start-cli
          echo "${START_CLI_SHA256}  /tmp/start-cli" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/start-cli "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          start-cli --version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check
        run: pnpm run check

      - name: Build release inputs
        run: |
          make clean
          pnpm run build:release-inputs

      - name: Build signed artifacts
        env:
          STARTOS_DEVELOPER_KEY_PEM: ${{ secrets.STARTOS_DEVELOPER_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${STARTOS_DEVELOPER_KEY_PEM:-}" ]; then
            echo "STARTOS_DEVELOPER_KEY_PEM is required for release-grade signed .s9pk artifacts." >&2
            exit 1
          fi
          mkdir -p "$HOME/.startos"
          key_path="$HOME/.startos/developer.key.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$STARTOS_DEVELOPER_KEY_PEM" > "$key_path"
          chmod 600 "$key_path"
          unset STARTOS_DEVELOPER_KEY_PEM
          make x86
          make arm
          rm -f "$key_path"
          trap - EXIT
          sha256sum hashrate-autopilot-9_x86_64.s9pk hashrate-autopilot-9_aarch64.s9pk > SHA256SUMS

      - name: Verify artifacts
        run: sha256sum -c SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: startos-artifacts
          path: |
            hashrate-autopilot-9_x86_64.s9pk
            hashrate-autopilot-9_aarch64.s9pk
            SHA256SUMS
